name: Core CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  host-tests:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out source
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Configure
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: cmake --build build --parallel

      - name: Test
        run: ctest --test-dir build --output-on-failure

  noods-core-tests:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out source
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Fetch pinned NooDS core
        run: bash scripts/fetch_noods.sh

      - name: Exercise NooDS ARM, memory, Turbo capture, and video paths
        run: bash scripts/test_noods_core.sh

      - name: Check the Xbox frontend against its LibXenon API surface
        run: bash scripts/test_xenon_frontend_syntax.sh

      - name: Exercise bounded nonblocking video submission
        run: bash scripts/test_noods_video.sh

      - name: Exercise exact pacing with legitimate uniform frames
        run: bash scripts/test_noods_frontend.sh

  xenon-runtime:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out source
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Build LibXenon runtime probe
        run: >-
          docker run --rm
          -v "$GITHUB_WORKSPACE:/app"
          -w /app/platform/xenon
          free60/libxenon:latest
          bash -lc make

      - name: Upload XeLL executable
        uses: actions/upload-artifact@v4
        with:
          name: xenonds-runtime-probe
          path: platform/xenon/xenonds-probe.elf32
          if-no-files-found: error

  xenon-desmume-checkpoint:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out source
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Build DeSmuME interpreter checkpoint
        run: >-
          docker run --rm
          -v "$GITHUB_WORKSPACE:/app"
          -w /app
          free60/libxenon:latest
          bash -lc "bash scripts/fetch_upstreams.sh && make -C platform/xenon WITH_DESMUME=1 && make -C platform/xenon/loader && mkdir -p platform/xenon/release/XenonDS && cp platform/xenon/loader/xenonds-loader.elf32 platform/xenon/release/xenon.elf && cp platform/xenon/xenonds-desmume.elf32 platform/xenon/release/XenonDS/xenonds-core.elf32 && cp platform/xenon/loader/USB_README.txt platform/xenon/release/README.txt"

      - name: Upload XeLL executable
        uses: actions/upload-artifact@v4
        with:
          name: XenonDS-v0.6.1-fast-timing
          path: platform/xenon/release
          if-no-files-found: error

      - name: Upload Xenon debug symbols
        uses: actions/upload-artifact@v4
        with:
          name: XenonDS-v0.6.1-symbols
          path: |
            platform/xenon/xenonds-desmume.elf
            platform/xenon/build-desmume-fasttiming-o2/xenonds-desmume.elf.map
          if-no-files-found: error

  xenon-noods-release:
    needs: [host-tests, noods-core-tests]
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Check out source
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Build NooDS runtime and staged loader
        run: |
          docker pull free60/libxenon:latest
          LIBXENON_IMAGE="$(docker image inspect --format='{{index .RepoDigests 0}}' free60/libxenon:latest)"
          test -n "$LIBXENON_IMAGE"
          docker run --rm \
            -e LIBXENON_IMAGE="$LIBXENON_IMAGE" \
            -v "$GITHUB_WORKSPACE:/app" \
            -w /app \
            "$LIBXENON_IMAGE" \
            bash -lc "bash scripts/fetch_noods.sh && make -C platform/xenon clean WITH_NOODS=1 && make -C platform/xenon WITH_NOODS=1 && make -C platform/xenon/loader clean && make -C platform/xenon/loader && bash scripts/package_noods_runtime.sh && bash scripts/package_noods_source.sh"

      - name: Verify v0.9.1 release files
        run: |
          test -s platform/xenon/release-noods/xenon.elf
          test -s platform/xenon/release-noods/XenonDS/xenonds-core.elf32
          test -s platform/xenon/xenonds-noods.elf
          test -s platform/xenon/build-noods/xenonds-noods.elf.map
          test -s platform/xenon/XenonDS-v0.9.1-source.tar.gz
          grep -q '^XenonDS v0.9.1' platform/xenon/release-noods/VERSION.txt
          grep -a -q 'v0.9.1' platform/xenon/release-noods/xenon.elf
          grep -a -q 'v0.9.1' platform/xenon/release-noods/XenonDS/xenonds-core.elf32
          (cd platform/xenon/release-noods && sha256sum -c SHA256SUMS)
          tar -tzf platform/xenon/XenonDS-v0.9.1-source.tar.gz | grep -q '^XenonDS-v0.9.1/BUILD_PROVENANCE.txt$'

      - name: Upload USB-ready v0.9.1 runtime
        uses: actions/upload-artifact@v4
        with:
          name: XenonDS-v0.9.1-noods-runtime
          path: platform/xenon/release-noods
          if-no-files-found: error

      - name: Upload v0.9.1 debug symbols
        uses: actions/upload-artifact@v4
        with:
          name: XenonDS-v0.9.1-noods-symbols
          path: |
            platform/xenon/xenonds-noods.elf
            platform/xenon/build-noods/xenonds-noods.elf.map
          if-no-files-found: error

      - name: Upload v0.9.1 corresponding source
        uses: actions/upload-artifact@v4
        with:
          name: XenonDS-v0.9.1-source
          path: platform/xenon/XenonDS-v0.9.1-source.tar.gz
          if-no-files-found: error
